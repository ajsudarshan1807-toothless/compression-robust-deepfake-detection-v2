version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake-detector-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./results:/app/results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit-fallback:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake-detector-streamlit
    command: ["streamlit", "run", "apps/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    restart: unless-stopped
