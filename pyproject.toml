[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detector"
version = "0.1.0"
description = "Compression-Robust Deepfake Detection using Multi-Scale Spatial and Frequency Ensembles"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sudarshan", email = "ajsudarshan1807@gmail.com" }
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "facenet-pytorch>=2.5.3",
    "PyWavelets>=1.5.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
    "tqdm>=4.65.0",
    "datasets>=2.18.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "grad-cam>=1.5.0",
    "plotly>=5.18.0",
    "imagehash>=4.3.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepfake_detector*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
